name: Extension

# Packages `vscode-vue-brace.vsix` (see `containers/extension/run.sh`) and attaches it to the
# GitHub release for the tag.
#
# The Marketplace has no automated route from here: the secretless one, trusted publishing
# (`vsce publish --oidc`), is not enabled — the exchange endpoint answers *every* request with
# `TrustedPublishingNotSupportedException` (microsoft/vscode-vsce#1275) — and the alternatives
# (a Personal Access Token, or Entra ID) both need an Azure DevOps organisation. So the last step
# is a drag: take the `.vsix` from the release and drop it on
# https://marketplace.visualstudio.com/manage. When `--oidc` starts working, add a job that
# downloads the same artifact and publishes it; nothing above changes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # `--output` is a BuildKit feature, and the packaging build uses it to export the `.vsix`.
  DOCKER_BUILDKIT: '1'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the extension
        env:
          # Empty on a branch dispatch, so the tag check is skipped rather than failed.
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          docker build -f containers/extension/Containerfile \
            --target artifact \
            --build-arg RELEASE_TAG \
            --output type=local,dest=out \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vue-brace-vsix
          path: out/vscode-vue-brace.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    # No `environment:` here, unlike the npm release: there is no secret to scope, and nothing
    # outside this repository is touched. `contents: write` sits on this job, which is the only
    # one that writes.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vscode-vue-brace-vsix
          # The artifact holds one file, so it lands directly in here.
          path: vsix

      - name: Attach the extension to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent, so re-running a failed workflow does not trip over its own release.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" vsix/vscode-vue-brace.vsix --clobber

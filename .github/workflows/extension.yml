name: Extension

# The VS Code extension is the one artefact this repository cannot build for itself: `vsce` needs
# Node, and the dev container has none by design. A runner has it, so packaging lives here.
#
# The `.vsix` is attached to the GitHub Release for the tag, not uploaded to the Marketplace. No
# automatic route to the Marketplace is available: the secretless one, trusted publishing
# (`vsce publish --oidc`), is not enabled — the exchange endpoint answers *every* request, valid
# token or not, with `TrustedPublishingNotSupportedException` (microsoft/vscode-vsce#1275) — and the
# alternatives (a Personal Access Token, or Entra ID) both need an Azure DevOps organization and a
# sign-in that is not universally available.
#
# So the last step is a drag: take `vscode-vue-brace.vsix` from the release and drop it on
# https://marketplace.visualstudio.com/manage. When `--oidc` starts working, add a job that
# downloads the same artifact and runs `vsce publish --oidc` — nothing above it changes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `@vscode/vsce` requires Node >= 22.
          node-version: 22

      - name: Package
        working-directory: packages/vscode-vue-brace
        # `< /dev/null` so nothing can sit waiting for an answer: `vsce` prompts when a manifest
        # field it wants is missing, and a prompt on a runner is a step that times out. `vsce` is
        # not pinned: the old exact `4.0.1-1` pin existed only to speak the OIDC contract, which
        # this workflow no longer uses.
        run: npx --yes @vscode/vsce package --out vscode-vue-brace.vsix < /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vue-brace-vsix
          path: packages/vscode-vue-brace/vscode-vue-brace.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    # No `environment:` here, unlike the npm release: there is no secret to scope, and nothing
    # outside this repository is touched. `contents: write` sits on this job rather than on
    # `package`, which only reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
          cache: true

      - name: Check the tag against the manifests
        # So a mistyped tag cannot put out a release whose file is a different version.
        run: deno run -A scripts/check-tag.ts "$GITHUB_REF_NAME"

      - uses: actions/download-artifact@v4
        with:
          name: vscode-vue-brace-vsix
          # The artifact holds one file, so it lands directly in here.
          path: vsix

      - name: Attach the extension to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent, so re-running a failed workflow does not trip over its own release.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" vsix/vscode-vue-brace.vsix --clobber

name: Release

# The release itself is `containers/release/run.sh` — Deno-only, it packs the packages and
# publishes them. This file only supplies the tag, the registry and the token.
#
#   git tag v0.1.4 && git push origin v0.1.4
#
# Needs one repository variable and one secret (Settings → Secrets and variables → Actions):
#
#   vars.NPM_REGISTRY   the registry to publish to
#   secrets.NPM_TOKEN   its publish token (omit if the registry allows anonymous publish)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to publish, matching the manifests (e.g. v0.1.4)
        required: true
      dry_run:
        description: Build, pack and check without publishing
        type: boolean
        default: true

permissions:
  contents: read

env:
  # The token is passed with `--secret`, which is a BuildKit feature.
  DOCKER_BUILDKIT: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Scopes `NPM_TOKEN` to releases instead of the whole repository, and allows a required
    # reviewer before anything is published. GitHub creates it on first use.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Run the release container
        env:
          NPM_REGISTRY: ${{ vars.NPM_REGISTRY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # A tag push sets GITHUB_REF_NAME to the tag; a manual run supplies it.
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        # The token goes through a file rather than `--secret id=…,env=…` so an empty value
        # (a dry run without the secret) is a valid secret rather than a build error.
        run: |
          printf '%s' "$NPM_TOKEN" > "$RUNNER_TEMP/npm_token"
          docker build -f containers/release/Containerfile \
            --build-arg RELEASE_TAG \
            --build-arg NPM_REGISTRY \
            --build-arg DRY_RUN \
            --secret "id=npm_token,src=$RUNNER_TEMP/npm_token" \
            .

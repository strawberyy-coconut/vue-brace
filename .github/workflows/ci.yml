name: CI

# The checks themselves are `containers/ci/run.sh`; this file only says when to run them and on
# what. Read the shell script, not this.
on:
  push:
    branches: [main, master]
  pull_request:

# A force-push or a follow-up commit cancels the run it superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `--output` and `--secret` are BuildKit features, and the container build uses both.
  DOCKER_BUILDKIT: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the CI container
        run: docker build -f containers/ci/Containerfile .
